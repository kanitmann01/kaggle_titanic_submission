<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titanic Survival Predictor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Apple Glassmorphic Design */
        .ship-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                0 4px 16px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .ship-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }
        
        .ship-header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 24px 24px 0 0;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .ship-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }
        .ship-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #3498db;
        }
        /* Glassmorphic Form Controls */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            color: #2c3e50;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .form-control::placeholder {
            color: rgba(44, 62, 80, 0.6);
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(52, 152, 219, 0.5);
            box-shadow: 
                0 0 0 3px rgba(52, 152, 219, 0.1),
                0 4px 16px rgba(0, 0, 0, 0.15);
            outline: none;
        }
        
        .form-label {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
        }
        
        /* Glassmorphic Buttons */
        .btn-predict, .btn-primary {
            background: rgba(52, 152, 219, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(52, 152, 219, 0.3);
            border-radius: 16px;
            padding: 14px 32px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 16px rgba(52, 152, 219, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-predict::before, .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }
        
        .btn-predict:hover, .btn-primary:hover {
            background: rgba(52, 152, 219, 0.9);
            transform: translateY(-3px);
            box-shadow: 
                0 8px 24px rgba(52, 152, 219, 0.4),
                0 4px 16px rgba(0, 0, 0, 0.15);
        }
        
        .btn-outline-light {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            transform: translateY(-2px);
        }
        .ship-rock {
            animation: shipRock 4s ease-in-out infinite;
            transform-origin: center bottom;
        }
        @keyframes shipRock {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="ship-container">
                    <div class="ship-header">
                        <i class="fas fa-ship ship-icon ship-rock"></i>
                        <h1 class="display-4 mb-0">🚢 Titanic Survival Predictor</h1>
                        <p class="lead mb-0">Would you have survived the Titanic?</p>
                        
                        <!-- GitHub Star Button -->
                        <div class="mt-3">
                            <a href="https://github.com/kanitmann01/kaggle_titanic_submission" 
                               target="_blank" 
                               class="btn btn-outline-light btn-sm">
                                <i class="fab fa-github me-2"></i>
                                ⭐ Star on GitHub
                            </a>
                        </div>
                        
                        <!-- Kaggle Score Disclaimer -->
                        <div class="mt-2">
                            <small class="text-light opacity-75">
                                <i class="fas fa-trophy me-1"></i>
                                Score: 0.74401 on Kaggle leaderboard - using Random Forest Classification
                            </small>
                        </div>
                    </div>
                    <div class="p-4">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
