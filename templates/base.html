<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titanic Survival Predictor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Neumorphic Color Palette */
            --bg-primary: #e6e7ee;
            --bg-secondary: #f0f1f7;
            --surface: #e6e7ee;
            --surface-light: #ffffff;
            --surface-dark: #d1d5db;
            
            /* Text Colors */
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            
            /* Accent Colors */
            --accent-blue: #4299e1;
            --accent-blue-dark: #3182ce;
            --accent-green: #48bb78;
            --accent-red: #f56565;
            --accent-orange: #ed8936;
            
            /* Neumorphic Shadows */
            --shadow-light: #ffffff;
            --shadow-dark: rgba(163, 177, 198, 0.6);
            --shadow-inset-light: inset 2px 2px 5px var(--shadow-dark);
            --shadow-inset-dark: inset -2px -2px 5px var(--shadow-light);
            --shadow-raised: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            --shadow-pressed: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 650px;
            padding: 2rem 1rem;
        }
        
        .ship-container {
            background: var(--surface);
            border-radius: 24px;
            box-shadow: var(--shadow-raised);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
        }
        
        .ship-container:hover {
            transform: translateY(-2px);
            box-shadow: 
                12px 12px 24px var(--shadow-dark), 
                -12px -12px 24px var(--shadow-light);
        }
        
        .ship-header {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-blue-dark) 100%);
            color: var(--surface-light);
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
            box-shadow: 
                inset 2px 2px 8px rgba(255, 255, 255, 0.2),
                inset -2px -2px 8px rgba(0, 0, 0, 0.2);
        }
        .ship-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--surface-light);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        h1.display-4 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .lead {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 500;
        }
        
        /* Neumorphic Form Controls */
        .form-control, .form-select {
            background: var(--surface);
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-pressed);
            margin-bottom: 1rem;
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .form-control:focus, .form-select:focus {
            outline: none;
            box-shadow: 
                inset 2px 2px 8px var(--shadow-dark),
                inset -2px -2px 8px var(--shadow-light),
                0 0 0 4px rgba(66, 153, 225, 0.1);
            transform: scale(1.02);
        }
        
        .form-control:hover, .form-select:hover {
            box-shadow: 
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
        }
        
        .form-label {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Neumorphic Buttons */
        .btn-predict, .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-blue-dark) 100%);
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            font-weight: 600;
            color: var(--surface-light);
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-raised);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        
        .btn-predict:hover, .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                12px 12px 24px var(--shadow-dark),
                -12px -12px 24px var(--shadow-light);
            color: var(--surface-light);
        }
        
        .btn-predict:active, .btn-primary:active {
            transform: translateY(-1px);
            box-shadow: var(--shadow-pressed);
        }
        
        .btn-outline-light {
            background: var(--surface);
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 600;
            padding: 10px 18px;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }
        
        .btn-outline-light:hover {
            transform: translateY(-2px);
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            color: var(--text-primary);
        }
        
        .btn-outline-light:active {
            transform: translateY(0);
            box-shadow: var(--shadow-pressed);
        }
        /* Ship Animation - Smooth & Intuitive */
        .ship-rock {
            animation: shipFloat 4s ease-in-out infinite;
            transform-origin: center center;
            will-change: transform;
        }
        
        @keyframes shipFloat {
            0%, 100% { transform: rotate(-4deg) translateY(0px); }
            25% { transform: rotate(-2deg) translateY(-2px); }
            50% { transform: rotate(4deg) translateY(0px); }
            75% { transform: rotate(2deg) translateY(-1px); }
        }
        
        /* Content Area */
        .content-area {
            background: var(--surface);
            padding: 2rem;
            border-radius: 0 0 24px 24px;
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
        }
        
        /* Neumorphic Cards */
        .neuro-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-raised);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .neuro-card:hover {
            transform: translateY(-2px);
            box-shadow: 
                12px 12px 24px var(--shadow-dark),
                -12px -12px 24px var(--shadow-light);
        }
        
        /* Form Groups */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        /* GitHub Button Specific */
        .github-btn {
            background: var(--surface);
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 8px 16px;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                3px 3px 6px var(--shadow-dark),
                -3px -3px 6px var(--shadow-light);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .github-btn:hover {
            transform: translateY(-1px);
            box-shadow: 
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
            color: var(--accent-blue);
            text-decoration: none;
        }
        
        /* Score Badge */
        .score-badge {
            background: var(--surface);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            box-shadow: 
                inset 2px 2px 4px var(--shadow-dark),
                inset -2px -2px 4px var(--shadow-light);
            margin-top: 0.5rem;
            display: inline-block;
        }
        
        /* Performance Optimizations */
        .ship-container, .btn-predict, .btn-primary, .form-control, .form-select, .neuro-card {
            will-change: transform, box-shadow;
        }
        
        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 1rem 0.5rem;
            }
            
            .ship-header {
                padding: 1.5rem 1rem;
            }
            
            .content-area {
                padding: 1.5rem;
            }
            
            h1.display-4 {
                font-size: 1.8rem;
            }
            
            .ship-icon {
                font-size: 2rem;
            }
            
            .btn-predict, .btn-primary {
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .form-control, .form-select {
                padding: 12px 16px;
            }
        }
        
        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            .ship-rock {
                animation: none;
            }
            
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="ship-container">
                    <div class="ship-header">
                        <i class="fas fa-ship ship-icon ship-rock"></i>
                        <h1 class="display-4 mb-0">🚢 Titanic Survival Predictor</h1>
                        <p class="lead mb-0">Would you have survived the Titanic?</p>
                        
                        <!-- GitHub Star Button -->
                        <div class="mt-3">
                            <a href="https://github.com/kanitmann01/kaggle_titanic_submission" 
                               target="_blank" 
                               class="github-btn">
                                <i class="fab fa-github"></i>
                                <span>⭐ Star on GitHub</span>
                            </a>
                        </div>
                        
                        <!-- Kaggle Score Badge -->
                        <div class="mt-3">
                            <div class="score-badge">
                                <i class="fas fa-trophy me-1"></i>
                                Kaggle Score: 0.74401 • Random Forest ML
                            </div>
                        </div>
                    </div>
                    <div class="content-area">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
